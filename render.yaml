services:
  - type: web
    name: pethelp
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn pethelp.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SQLITE_PATH
        value: "/opt/render/project/src/db.sqlite3"
