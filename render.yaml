services:
  - type: web
    name: pethelp
    env: python
    plan: starter
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate && gunicorn pethelp.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SQLITE_PATH
        value: "/var/data/db.sqlite3"
      - key: MEDIA_ROOT
        value: "/var/data/media"
    disk:
      name: pethelp-data
      mountPath: /var/data
      sizeGB: 1
