{% extends 'base.html' %}
{% block title %}Login | PetHelp{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1583511655826-05700d52f4d9?auto=format&fit=crop&w=700&q=85" alt="Pets em ambiente acolhedor">
    </div>
    <div class="auth-form">
      <span class="eyebrow">Acesso seguro</span>
      <h1>Login</h1>
      <p>Entre para cadastrar pets, editar suas publicações e acompanhar a comunidade.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary full" type="submit">Entrar</button>
      </form>
      <p class="form-note">Ainda não tem conta? <a href="{% url 'cadastro_usuario' %}">Criar cadastro</a></p>
    </div>
  </div>
</section>
{% endblock %}
