{% extends 'base.html' %}
{% block content %}
<section class="form-page compact">
  <div class="form-card small-form">
    <span class="eyebrow">Acesso</span>
    <h1>Entrar na conta</h1>
    <p class="hint">Entre para publicar e gerenciar suas informacoes. A consulta aos pets continua aberta para todos.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <p class="form-note">Ainda nao tem conta? <a href="{% url 'cadastro_usuario' %}">Criar conta</a></p>
  </div>
</section>
{% endblock %}
